name: QMKG clean Windows cloud test

on:
  push:
    branches: [ci/qmkg-windows-cloud-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-protocol-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/qmkg-search-diagnostic.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qmkg-anonymous-search-diagnostic
          path: cloud-results/search-diagnostic.json
          retention-days: 7
  windows-clean:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      QMKG_CLOUD_AUTH_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure disposable runner paths
        shell: pwsh
        run: |
          "ELECTRON_BUILDER_CACHE=$env:RUNNER_TEMP\electron-builder-cache" >> $env:GITHUB_ENV
          "QMKG_INSTALLED_EXE=$env:RUNNER_TEMP\qmkg-install\Mineradio\Mineradio.exe" >> $env:GITHUB_ENV
          "PLAYWRIGHT_NODE_DIR=$env:RUNNER_TEMP\qmkg-test-tools\node_modules\playwright" >> $env:GITHUB_ENV
      - name: Install locked dependencies without restoring account or app caches
        run: npm ci --no-audit --no-fund
      - name: Run accompaniment and account regression tests
        run: node --test "tests/qmkg-*.test.js" tests/built-in-playlist-library.test.js
      - name: Build Windows 2.2.2 installer
        run: npm run build:win -- --publish never --x64 --config.extraMetadata.version=2.2.2 --config.extraMetadata.mineradio.update.disabled=true --config.nsis.artifactName=Mineradio-2.2.2-QMKG-Setup.exe
      - name: Install app into a disposable runner directory
        shell: pwsh
        run: ./tools/qmkg-cloud-install.ps1
      - name: Install isolated browser test tooling
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/qmkg-test-tools" --no-save --package-lock=false playwright@1.62.1
      - name: Start installed app and prepare official QR
        shell: pwsh
        run: ./tools/qmkg-cloud-interactive.ps1
      - name: Transfer short-lived official QR for the user's phone confirmation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qmkg-official-qr-${{ github.run_id }}
          path: cloud-qr/official-login.png
          retention-days: 1
          if-no-files-found: error
      - name: Await phone confirmation and verify accompaniment playback and lyrics
        shell: pwsh
        run: ./tools/qmkg-cloud-interactive.ps1 -WaitForCompletion
      - name: Upload sanitized cloud report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qmkg-windows-cloud-report
          path: cloud-results/
          if-no-files-found: warn
          retention-days: 7
